# Render Blueprint: tek web servisi (Docker) + ücretsiz PostgreSQL.
databases:
  - name: talepio-db
    plan: free
    databaseName: talepio
    user: talepio

services:
  - type: web
    name: talepio
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talepio-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: SLA_RADAR_TICKER
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "5"
